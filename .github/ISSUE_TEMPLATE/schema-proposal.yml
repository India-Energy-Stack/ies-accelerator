name: Propose a Schema
description: Propose a new schema for the IES ecosystem. Your answers become a tracked proposal issue.
title: "[Schema proposal] "
labels: ["schema-proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a schema for the IES ecosystem. Fill in the fields below and click
        **Submit new issue** — your answers are captured as a tracked proposal our working group reviews.
        Fields marked *(required)* must be completed.
  - type: input
    id: name
    attributes:
      label: Name
      placeholder: Jane Doe
    validations:
      required: true
  - type: input
    id: organization
    attributes:
      label: Organization
      placeholder: Acme Utility / Regulator / University
    validations:
      required: true
  - type: input
    id: email
    attributes:
      label: Contact email
      placeholder: you@example.org
    validations:
      required: true
  - type: input
    id: mobile
    attributes:
      label: Contact mobile number
      placeholder: "+91 ..."
    validations:
      required: false
  - type: dropdown
    id: use_case
    attributes:
      label: Use case the proposed schema supports
      options:
        - Consumer Energy Passport
        - Consumer Meter Digest
        - Smart Meter Data Exchange
        - DER Visibility
        - DISCOM Regulatory Filing
        - Policy as Code
        - P2P Energy Transaction
        - Other / New use case (describe below)
    validations:
      required: true
  - type: textarea
    id: schema
    attributes:
      label: Schema
      description: Paste the proposed schema (YAML or JSON), or a link to it. Attributes, types, and examples all welcome.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: standards
    attributes:
      label: Standards the schema is based on
      description: Any existing standards, specs, or data models this draws on (e.g. Beckn, W3C VC, CIM, national metering standards).
      placeholder: e.g. W3C Verifiable Credentials, IS 16444 ...
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Any additional material
      description: Supporting docs, diagrams, reference implementations, or links.
    validations:
      required: false
