name: Build & publish PDF

# Build and stage the site for every pull request. On merge to main, publish
# the staged tree to gh-pages: public documentation and normative schema assets
# plus the freshly built implementation-guide PDF (schema content included as
# an appendix at the end — see scripts/build_pdf.py). GitHub Pages serves the
# same per-repo URLs, e.g.:
#   https://india-energy-stack.github.io/ies-accelerator/schemas/.../context.jsonld
#   https://india-energy-stack.github.io/ies-accelerator/ies-report.pdf

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # Republish when served content (docs, schema artifacts) or tooling changes.
    paths:
      - "**/*.md"
      - "**/*.json"
      - "**/*.jsonld"
      - "**/*.yaml"
      - "**/*.yml"
      - "scripts/build_pdf.py"
      - "scripts/build_pdf.sh"
      - "scripts/verify_pdf.py"
      - ".github/workflows/build-pdf.yml"
  workflow_dispatch: {}

# Avoid overlapping publishes if two merges land close together.
concurrency:
  group: build-pdf-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No write permission needed for GITHUB_TOKEN: the org disables write for it,
# so we publish using an SSH deploy key (secrets.ACTIONS_DEPLOY_KEY) instead.

env:
  TECTONIC_VERSION: "0.15.0"
  TECTONIC_SHA256: "875fbbc9ab48560d7776088c608e0beee49197b57ab4a2f6c5385b2c661c842f"
  MERMAID_CLI_VERSION: "11.16.0"

jobs:
  build-and-publish:
    name: PDF and staged-publication preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pandoc and fonts
        # fonts-dejavu provides "DejaVu Sans Mono" for the PDF's monofont
        # (the script defaults to macOS-only "Menlo", overridden below).
        # poppler-utils (pdfinfo/pdftotext) backs scripts/verify_pdf.py's PDF SMOKE checks.
        run: sudo apt-get update && sudo apt-get install -y pandoc fonts-dejavu poppler-utils

      - name: Cache tectonic binary
        id: cache-tectonic
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/bin/tectonic
          key: tectonic-${{ env.TECTONIC_VERSION }}-linux-x86_64

      - name: Install tectonic
        if: steps.cache-tectonic.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          url="https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${TECTONIC_VERSION}/tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          archive="$RUNNER_TEMP/tectonic-${TECTONIC_VERSION}.tar.gz"
          curl -fsSL "$url" -o "$archive"
          echo "${TECTONIC_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$HOME/.local/bin" tectonic
          chmod +x "$HOME/.local/bin/tectonic"

      - name: Add tectonic to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install mermaid-cli
        run: npm install -g "@mermaid-js/mermaid-cli@${MERMAID_CLI_VERSION}"

      - name: Derive reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Build PDF
        env:
          # Use the runner's preinstalled Chrome so puppeteer doesn't download
          # Chromium. build_pdf.sh writes a puppeteer.json from this var.
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
          # Menlo (the script default) is macOS-only; use a font present on the runner.
          MONOFONT: "DejaVu Sans Mono"
        run: bash scripts/build_pdf.sh

      - name: Verify PDF
        run: python3 -B scripts/verify_pdf.py --pdf build/ies_accelerator.pdf

      - name: Record build provenance
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          {
            echo "build_sha=${GITHUB_SHA}"
            echo "event_name=${GITHUB_EVENT_NAME}"
            echo "ref=${GITHUB_REF}"
            echo "pr_head_sha=${PR_HEAD_SHA}"
            echo "pr_base_sha=${PR_BASE_SHA}"
            echo "source_date_epoch=${SOURCE_DATE_EPOCH}"
            echo "tectonic=${TECTONIC_VERSION} sha256=${TECTONIC_SHA256}"
            echo "mermaid_cli=${MERMAID_CLI_VERSION}"
          } > build/publication-provenance.txt

      - name: Stage site
        run: |
          mkdir -p public
          # Mirror everything main currently serves so all existing URLs (schema
          # JSON/JSON-LD/YAML contexts, docs, etc.) keep resolving from gh-pages.
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='build/' \
            --exclude='public/' \
            --exclude='qaqc/' \
            --exclude='index.md' \
            ./ public/
          # Add the freshly built PDF (published as ies-report.pdf) and a root
          # landing page.
          cp build/ies_accelerator.pdf public/ies-report.pdf
          # Serve files literally (no Jekyll); .nojekyll is mirrored from root,
          # but ensure it exists.
          touch public/.nojekyll
          cat > public/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>IES Accelerator Implementation Guide</title>
          <meta http-equiv="refresh" content="0; url=ies-report.pdf">
          <p><a href="ies-report.pdf">IES Accelerator Implementation Guide (PDF)</a></p>
          HTML

      - name: Verify publish dir is complete
        # Guard against a complete-but-wrong tree: every tracked schema artifact
        # and the PDF must be present before we replace gh-pages. If anything is
        # missing the job fails here and the publish step is skipped, leaving
        # the live site untouched.
        run: |
          missing=0
          while IFS= read -r f; do
            if [ ! -f "public/$f" ]; then echo "MISSING: $f"; missing=1; fi
          done < <(git ls-files schemas/)
          [ -f public/ies-report.pdf ] || { echo "MISSING: ies-report.pdf"; missing=1; }
          if [ "$missing" -ne 0 ]; then
            echo "::error::publish dir incomplete; aborting before replacing gh-pages"
            exit 1
          fi
          echo "publish dir complete ($(git ls-files schemas/ | wc -l) schema files + PDF)"

          python3 -B scripts/verify_pdf.py --public-root public

          [ -s build/ies_accelerator.pdf ] || { echo "::error::build/ies_accelerator.pdf missing or empty"; exit 1; }
          [ -s public/ies-report.pdf ] || { echo "::error::public/ies-report.pdf missing or empty"; exit 1; }
          cmp -s build/ies_accelerator.pdf public/ies-report.pdf || { echo "::error::build/ies_accelerator.pdf and public/ies-report.pdf differ"; exit 1; }

          python3 -B scripts/verify_publication.py \
            --public-root public \
            --combined-md build/ies_combined.md \
            --manifest build/public-manifest.txt
          python3 -B scripts/verify_publication.py --self-test

      - name: Upload pull-request publication preview evidence
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v0.6-publication-preview-${{ github.sha }}
          path: |
            build/ies_accelerator.pdf
            build/public-manifest.txt
            build/publication-provenance.txt
          if-no-files-found: error

      - name: Publish to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
