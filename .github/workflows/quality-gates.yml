name: v0.6 quality gates

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core-validation:
    name: Core validation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-qaqc.lock

      - name: Install pinned QA dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-qaqc.lock

      - name: Validate intended-valid examples and semantic fixtures
        run: python -X utf8 -B scripts/run_schema_checks.py

      - name: Verify migration disposition, coverage, preservation, and current validity
        run: python -X utf8 -B scripts/verify_v05_v06_equivalence.py

      - name: Enforce the declared JSON-LD conformance scope
        run: python -X utf8 -B scripts/run_jsonld_checks.py

      - name: Verify links
        run: python -X utf8 -B scripts/validate_links.py

      - name: Verify canonical navigation parity
        run: python -X utf8 -B scripts/check_navigation.py

      - name: Verify generated field tables are fresh
        run: python -X utf8 -B scripts/generate_field_tables.py --all --check

      - name: Verify generated schema catalog is fresh
        run: python -X utf8 -B scripts/generate_schemas_ies.py --check

  negative-fixtures:
    name: Negative fixtures reject drift and omissions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-qaqc.lock

      - name: Install pinned QA dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-qaqc.lock

      - name: Run committed negative fixtures
        run: python -X utf8 -B scripts/run_negative_fixtures.py

  electricity-credential-mirror:
    name: ElectricityCredential pinned mirror
    runs-on: ubuntu-latest
    # Advisory only. The local ElectricityCredential v1.2 directory is a
    # deliberately customized copy (friendly unit strings, inlined context
    # terms, enriched examples), not a byte-verbatim upstream mirror -- as the
    # schema's own README documents. This job surfaces drift for review but
    # must not block merges until an independently reviewed upstream refresh is
    # performed. See scripts/verify_ec_mirror.py.
    continue-on-error: true
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Compare the frozen mirror with pinned DEG upstream
        run: python -X utf8 -B scripts/verify_ec_mirror.py
